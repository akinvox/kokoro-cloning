[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akinvox-kokoro-cloning"
version = "1.0.2"
description = "Reference-audio cloning for Kokoro with an optional LoRA adapter"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "licenses/*"]
authors = [{name = "AkinVox"}]
dependencies = [
  "torch==2.6.0", "torchaudio==2.6.0", "kokoro==0.9.4",
  "transformers==4.57.3", "huggingface-hub==0.36.0",
  "misaki[en]==0.9.4", "spacy==3.8.11", "click==8.1.8",
  "typer==0.16.1", "typer-slim==0.16.1", "numpy==1.26.4",
  "scipy==1.14.0", "munch==4.0.0", "soundfile==0.13.1",
  "soxr==1.0.0", "silero-vad==6.2.0"
]

[project.optional-dependencies]
demo = ["gradio==5.44.1"]

[project.scripts]
kokoro-clone = "kokoro_cloning.cli:main"
kokoro-clone-demo = "kokoro_cloning.demo:main"

[project.urls]
Homepage = "https://akinvox.com"
Repository = "https://github.com/akinvox/kokoro-cloning"
Weights = "https://huggingface.co/AKinvox/kokoro-cloning-v1"

[tool.setuptools.packages.find]
include = ["kokoro_cloning*"]

